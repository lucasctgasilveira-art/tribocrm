caption: |
  "É sobre aquela condição que você me passou..." E o vendedor não faz ideia de qual condição.

  Segunda dor da série: o cliente liga e o vendedor não lembra do que falou.

  Aí começa a cena. Três meses de WhatsApp pra rolar, o cliente esperando na linha, e a mensagem certa perdida entre áudio, orçamento de outro cliente e bom-dia do grupo. O cliente percebe. E cliente que se sente esquecido só continua a conversa por um motivo: preço.

  A saída não tem glamour nenhum: toda conversa termina com uma linha anotada no lead. O que foi combinado, o valor e a próxima data. Leva menos de um minuto. Na próxima ligação, você abre o lead e fala como quem lembra — porque tá escrito.

  Quinta a gente conta um bastidor sobre isso: por que o TriboCRM fica do lado do WhatsApp.

