caption: |
  O vendedor leva até a proposta. Na hora de fechar, o cliente pergunta: "o dono pode vir?". E você vai.

  Essa semana a gente abre uma série curta com 4 dores que toda PME brasileira conhece. A primeira: o dono é o melhor vendedor da empresa e não consegue sair da venda.

  Não é falta de vendedor bom. É que o método mora na sua cabeça: quem é cliente bom, que pergunta fazer, até onde o preço vai, quando segurar. Como nada disso tá escrito, só você fecha. E a empresa cresce até o tamanho da sua agenda.

  A saída começa pequena. Na próxima venda grande, anota no lead as perguntas que você faria e o limite de preço. O vendedor fecha com o seu roteiro. Você entra só se ele pedir.

  Máquina de Vendas é isso: o que tá na cabeça do dono vira processo que o time roda sem ele.

  Salva pra próxima vez que pedirem o dono 🔥

